<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OGA-FAC-018 "Registro de Asistencia" R/11 </title>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    :root{
      --bg:#f4f6f8;
      --card:#ffffff;
      --text:#1f2937;
      --muted:#6b7280;
      --line:#e5e7eb;
      --primary:#1e88e5;
      --success:#0f766e;
      --danger:#dc2626;
      --warning:#b45309;
      --shadow:0 8px 24px rgba(0,0,0,.08);
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      padding:20px;
      background:var(--bg);
      font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color:var(--text);
    }

    .wrap{
      max-width:780px;
      margin:0 auto;
    }

    .card{
      background:var(--card);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:24px;
      border:1px solid var(--line);
    }

    h1{
      margin:0 0 8px;
      color:#1d4ed8;
      font-size:32px;
    }

    .subtitle{
      color:var(--muted);
      margin:0 0 20px;
      font-size:15px;
    }

    .info-box{
      background:#f8fafc;
      border:1px solid var(--line);
      border-radius:14px;
      padding:16px;
      margin-bottom:18px;
    }

    .info-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px 16px;
    }

    .info-item b{
      display:block;
      font-size:12px;
      color:var(--muted);
      margin-bottom:4px;
      text-transform:uppercase;
    }

    .info-item span{
      font-size:14px;
      color:var(--text);
      font-weight:600;
      word-break:break-word;
    }

    .field{
      margin-bottom:14px;
    }

    .field label{
      display:block;
      font-weight:700;
      margin-bottom:6px;
      font-size:14px;
    }

    .field input,
    .field select,
    .field textarea{
      width:100%;
      padding:12px 14px;
      border:1px solid #cfd4dc;
      border-radius:10px;
      font-size:15px;
      background:#fff;
      outline:none;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus{
      border-color:#1e88e5;
      box-shadow:0 0 0 3px rgba(30,136,229,.15);
    }

    .btn{
      width:100%;
      border:none;
      border-radius:12px;
      padding:14px 18px;
      font-size:15px;
      font-weight:800;
      color:#fff;
      background:var(--success);
      cursor:pointer;
      transition:all .15s ease;
    }

    .btn:hover{
      filter:brightness(.98);
    }

    .btn:disabled{
      opacity:.65;
      cursor:not-allowed;
      filter:none;
    }

    .estado{
      display:inline-block;
      padding:6px 10px;
      border-radius:999px;
      font-size:12px;
      font-weight:800;
      background:#e0f2fe;
      color:#075985;
      margin-bottom:10px;
    }

    .estado.abierto{
      background:#dcfce7;
      color:#166534;
    }

    .estado.cerrado{
      background:#fee2e2;
      color:#991b1b;
    }

    .estado.error{
      background:#fef3c7;
      color:#92400e;
    }

    .debug-box{
      margin-top:18px;
      padding:14px 16px;
      border:1px dashed #cbd5e1;
      border-radius:12px;
      background:#f8fafc;
      font-size:12px;
      color:#475569;
    }

    .debug-box h3{
      margin:0 0 10px;
      font-size:13px;
      color:#334155;
    }

    .debug-row{
      margin:4px 0;
      word-break:break-word;
    }

    .debug-label{
      font-weight:700;
      color:#0f172a;
    }

    @media (max-width: 700px){
      .info-grid{
        grid-template-columns:1fr;
      }

      h1{
        font-size:26px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="estado" id="estadoEvento">Cargando evento...</div>
      <h1>Registro de Asistencia V2</h1>
      <p class="subtitle">Complete su participación en la reunión correspondiente.</p>

      <div class="info-box">
        <div class="info-grid">
          <div class="info-item">
            <b>Registro de acreditación</b>
            <span id="txtRegistro">-</span>
          </div>
          <div class="info-item">
            <b>Razón social</b>
            <span id="txtRazon">-</span>
          </div>
          <div class="info-item">
            <b>Tipo de evaluación</b>
            <span id="txtTipoEvaluacion">-</span>
          </div>
          <div class="info-item">
            <b>Tipo de actividad</b>
            <span id="txtTipoActividad">-</span>
          </div>
          <div class="info-item">
            <b>Oficial asignado</b>
            <span id="txtOficial">-</span>
          </div>
          <div class="info-item">
            <b>Estado</b>
            <span id="txtEstado">-</span>
          </div>
        </div>
      </div>

      <div class="field">
        <label for="nombreCompleto">Nombre completo *</label>
        <input type="text" id="nombreCompleto">
      </div>

      <div class="field">
        <label for="correo">Correo electrónico *</label>
        <input type="email" id="correo">
      </div>

      <div class="field">
        <label for="institucion">Organización que representa *</label>
        <select id="institucion">
          <option value="">Seleccione...</option>
          <option value="OGA">OGA</option>
          <option value="Organismo Evaluado">Organismo Evaluado</option>
        </select>
      </div>

      <div class="field">
        <label for="rol">Rol *</label>
        <select id="rol">
          <option value="">Seleccione...</option>
          <option value="Miembro de equipo evaluador">Miembro de equipo evaluador</option>
          <option value="Personal del Organismo Evaluado">Personal del Organismo Evaluado</option>
        </select>
      </div>

      <div class="field">
        <label for="puesto">Puesto dentro del Organismo Evaluado *</label>
        <input type="text" id="puesto">
      </div>

      <div class="field">
        <label for="observaciones">Observaciones</label>
        <textarea id="observaciones" rows="3"></textarea>
      </div>

      <button class="btn" id="btnRegistrar" onclick="enviarRegistro()">Registrar asistencia</button>

      <!--<div class="debug-box">
        <h3>Depuración</h3>
        <div class="debug-row"><span class="debug-label">Token:</span> <span id="debugToken">-</span></div>
        <div class="debug-row"><span class="debug-label">URL actual:</span> <span id="debugUrl">-</span></div>
        <div class="debug-row"><span class="debug-label">Huella HTML:</span> <span id="debugHuellaHtml">-</span></div>
        <div class="debug-row"><span class="debug-label">Trace backend:</span> <span id="debugTrace">-</span></div>
        <div class="debug-row"><span class="debug-label">Resultado:</span> <span id="debugResultado">Pendiente</span></div>
      </div> --> 
    </div>
  </div>

  <script>
    const TOKEN = <?= JSON.stringify(token) ?>;
    const DEBUG_INFO = <?= JSON.stringify(typeof debugInfo !== 'undefined' ? debugInfo : null) ?>;
    let eventoActual = null;

    document.addEventListener('DOMContentLoaded', () => {
      pintarDebugInicial();
      cargarEvento();
    });

    function setText(id, value) {
      const el = document.getElementById(id);
      if (el) el.textContent = value == null || value === '' ? '-' : String(value);
    }

    function pintarDebugInicial() {
      setText('debugToken', TOKEN || '(vacío)');
      setText('debugUrl', window.location.href || '(sin URL)');

      if (DEBUG_INFO) {
        const huella = [
          DEBUG_INFO.marca || 'sin-marca',
          DEBUG_INFO.ssId || 'sin-ss',
          DEBUG_INFO.hoja || 'sin-hoja'
        ].join(' | ');
        setText('debugHuellaHtml', huella);
      } else {
        setText('debugHuellaHtml', 'Sin debugInfo inyectado desde doGet');
      }

      setText('debugTrace', 'Esperando respuesta del backend');
      setText('debugResultado', 'Cargando evento...');
    }

    function cargarEvento() {
      console.log('TOKEN HTML:', TOKEN);
      console.log('URL ACTUAL:', window.location.href);
      console.log('DEBUG_INFO:', DEBUG_INFO);

      Swal.fire({
        title: 'Cargando...',
        allowOutsideClick: false,
        didOpen: () => Swal.showLoading()
      });

      google.script.run
        .withSuccessHandler((resp) => {
          Swal.close();
          console.log('RESPUESTA EVENTO:', resp);

          const traceTxt = (resp && resp.trace)
            ? JSON.stringify(resp.trace)
            : 'Sin trace devuelta por backend';

          setText('debugTrace', traceTxt);

          if (!resp || !resp.ok) {
            setText('debugResultado', (resp && resp.message) ? resp.message : 'No se encontró el evento.');
            marcarEstadoVisual('Error de carga', 'error');

            Swal.fire({
              icon: 'error',
              title: 'Enlace inválido',
              text: (resp && resp.message) ? resp.message : 'No se encontró el evento.'
            });
            return;
          }

          eventoActual = resp.evento || null;
          pintarEvento(eventoActual);
          setText('debugResultado', 'Evento cargado correctamente');
        })
        .withFailureHandler((err) => {
          console.error('ERROR google.script.run:', err);
          setText('debugResultado', extraerMensajeError(err));
          setText('debugTrace', 'Error de ejecución');
          marcarEstadoVisual('Error', 'error');

          Swal.fire({
            icon: 'error',
            title: 'Error',
            text: extraerMensajeError(err)
          });
        })
        .obtenerEventoPublicoAsistencia(TOKEN);
    }

    function pintarEvento(ev) {
      if (!ev) return;

      setText('txtRegistro', ev.oecId || '-');
      setText('txtRazon', ev.razonSocial || '-');
      setText('txtTipoEvaluacion', ev.tipoEvaluacion || '-');
      setText('txtTipoActividad', ev.tipoActividad || '-');
      setText('txtOficial', ev.oficialAsignado || '-');
      setText('txtEstado', ev.estadoEvento || '-');

      /*const estado = String(ev.estadoEvento || '').trim().toLowerCase();

      if (estado === 'cerrado') {
        marcarEstadoVisual(ev.estadoEvento || 'Cerrado', 'cerrado');
        bloquearFormulario(true);
      } else {
        marcarEstadoVisual(ev.estadoEvento || 'Abierto', 'abierto');
        bloquearFormulario(false);
      }*/
      const estado = String(ev.estadoEvento || '').trim().toLowerCase();

      if (ev.fechaReunion) {
        setText('txtEstado', `${ev.estadoEvento || '-'} · Fecha permitida: ${ev.fechaReunion}`);
      }

      if (estado === 'cerrado') {
        marcarEstadoVisual(ev.estadoEvento || 'Cerrado', 'cerrado');
        bloquearFormulario(true);
        return;
      }

      if (ev.registroPermitido === false) {
        marcarEstadoVisual(ev.estadoOperativo || 'Registro no disponible', 'error');
        bloquearFormulario(true);

        Swal.fire({
          icon: 'info',
          title: 'Registro no disponible',
          text: ev.mensajeVentana || 'La lista no está habilitada para registrar asistencia en esta fecha.'
        });

        return;
      }

      marcarEstadoVisual(ev.estadoEvento || 'Abierto', 'abierto');
      bloquearFormulario(false);

    }

    function marcarEstadoVisual(texto, clase) {
      const el = document.getElementById('estadoEvento');
      if (!el) return;

      el.textContent = texto || 'Sin estado';
      el.className = 'estado';

      if (clase) {
        el.classList.add(clase);
      }
    }

    function bloquearFormulario(bloquear) {
      const ids = [
        'nombreCompleto',
        'correo',
        'institucion',
        'rol',
        'puesto',
        'observaciones',
        'btnRegistrar'
      ];

      ids.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.disabled = !!bloquear;
      });
    }

    function enviarRegistro() {
      const datos = {
        token: TOKEN,
        nombreCompleto: (document.getElementById('nombreCompleto').value || '').trim(),
        correo: (document.getElementById('correo').value || '').trim(),
        institucion: (document.getElementById('institucion').value || '').trim(),
        rol: (document.getElementById('rol').value || '').trim(),
        puesto: (document.getElementById('puesto').value || '').trim(),
        observaciones: (document.getElementById('observaciones').value || '').trim()
      };

      if (!datos.nombreCompleto || !datos.correo || !datos.institucion || !datos.rol || !datos.puesto) {
        Swal.fire({
          icon: 'warning',
          title: 'Campos incompletos',
          text: 'Complete los campos obligatorios.'
        });
        return;
      }

      Swal.fire({
        title: 'Registrando...',
        allowOutsideClick: false,
        didOpen: () => Swal.showLoading()
      });

      google.script.run
        .withSuccessHandler((resp) => {
          Swal.close();
          console.log('RESPUESTA REGISTRO:', resp);

          if (!resp || !resp.ok) {
            setText('debugResultado', (resp && resp.message) ? resp.message : 'Error al registrar');
            Swal.fire({
              icon: 'error',
              title: 'No fue posible registrar',
              text: (resp && resp.message) ? resp.message : 'Error desconocido.'
            });
            return;
          }

          setText('debugResultado', resp.message || 'Registro guardado correctamente.');

          Swal.fire({
            icon: 'success',
            title: 'Asistencia registrada',
            text: resp.message || 'Registro guardado correctamente.'
          });

          document.getElementById('nombreCompleto').value = '';
          document.getElementById('correo').value = '';
          document.getElementById('institucion').value = '';
          document.getElementById('rol').value = '';
          document.getElementById('puesto').value = '';
          document.getElementById('observaciones').value = '';
        })
        .withFailureHandler((err) => {
          console.error('ERROR AL REGISTRAR:', err);
          setText('debugResultado', extraerMensajeError(err));

          Swal.fire({
            icon: 'error',
            title: 'Error',
            text: extraerMensajeError(err)
          });
        })
        .guardarRegistroPublicoAsistencia(datos);
    }

    function extraerMensajeError(err) {
      if (!err) return 'Error no especificado.';
      if (typeof err === 'string') return err;
      if (err.message) return err.message;
      try {
        return JSON.stringify(err);
      } catch (e) {
        return 'Ocurrió un error inesperado.';
      }
    }
  </script>
</body>
</html>
