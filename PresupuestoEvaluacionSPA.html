<style>
#presupuestoEvalRoot{
    --bg:#f5f7f8;
    --card:#ffffff;
    --text:#1d2730;
    --muted:#68747d;
    --line:#dfe6e8;
    --brand:#356854;
    --brand-soft:#eaf2ee;
    --danger:#a93232;
    --warning:#9b6a16;
    --shadow:0 10px 30px rgba(26,44,36,.08);
  }
  #presupuestoEvalRoot, #presupuestoEvalRoot *{box-sizing:border-box}
  #presupuestoEvalRoot{
    margin:0;background:var(--bg);color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
  }
  #presupuestoEvalRoot .topbar{
    background:var(--card);border-bottom:1px solid var(--line);
    padding:18px 28px;display:flex;justify-content:space-between;
    gap:20px;align-items:center;position:sticky;top:0;z-index:20;
  }
  #presupuestoEvalRoot .topbar h1{margin:2px 0 4px;font-size:24px}
  #presupuestoEvalRoot .eyebrow{font-size:12px;font-weight:700;color:var(--brand);text-transform:uppercase}
  #presupuestoEvalRoot .meta{font-size:12px;color:var(--muted)}
  #presupuestoEvalRoot .userbox{display:flex;gap:12px;align-items:center;font-size:13px}
  #presupuestoEvalRoot .shell{max-width:1280px;margin:22px auto;padding:0 18px}
  #presupuestoEvalRoot .tabs{
    display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:14px
  }
  #presupuestoEvalRoot .tab{
    padding:12px 10px;border:1px solid var(--line);background:#fff;border-radius:12px;
    cursor:pointer;font-weight:700;color:#42505a;
  }
  #presupuestoEvalRoot .tab span{
    display:inline-flex;width:22px;height:22px;align-items:center;justify-content:center;
    border-radius:50%;background:#edf1f2;margin-right:5px
  }
  #presupuestoEvalRoot .tab.active{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
  #presupuestoEvalRoot .tab.done{border-color:#9fc7b6}
  #presupuestoEvalRoot .tab:disabled{opacity:.45;cursor:not-allowed}
  #presupuestoEvalRoot .content{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
  #presupuestoEvalRoot .panel{display:none;padding:24px}
  #presupuestoEvalRoot .panel.active{display:block}
  #presupuestoEvalRoot .panel h2{margin:0 0 5px}
  #presupuestoEvalRoot .lead{margin:0 0 22px;color:var(--muted)}
  #presupuestoEvalRoot .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  #presupuestoEvalRoot .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
  #presupuestoEvalRoot .field label{display:block;font-size:12px;font-weight:700;margin:0 0 6px;color:#46545e}
  #presupuestoEvalRoot .field input, #presupuestoEvalRoot .field select, #presupuestoEvalRoot .field textarea{
    width:100%;padding:11px 12px;border:1px solid #cfd8dc;border-radius:10px;
    font-size:14px;background:#fff
  }
  #presupuestoEvalRoot .field input:focus, #presupuestoEvalRoot .field select:focus, #presupuestoEvalRoot .field textarea:focus{
    outline:2px solid #c7ddd3;border-color:var(--brand)
  }
  #presupuestoEvalRoot .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
  #presupuestoEvalRoot button.primary, #presupuestoEvalRoot button.secondary, #presupuestoEvalRoot button.ghost{
    border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer
  }
  #presupuestoEvalRoot button.primary{background:var(--brand);color:white}
  #presupuestoEvalRoot button.secondary{background:#eef2f3;color:#2c3941}
  #presupuestoEvalRoot button.ghost{background:white;border:1px solid var(--line)}
  #presupuestoEvalRoot .summary{
    padding:15px;border:1px solid var(--line);border-radius:12px;background:#fafcfc;margin:14px 0
  }
  #presupuestoEvalRoot .summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  #presupuestoEvalRoot .k{font-size:11px;color:var(--muted);text-transform:uppercase}
  #presupuestoEvalRoot .v{font-size:14px;font-weight:700;margin-top:3px;word-break:break-word}
  #presupuestoEvalRoot .team-row{
    display:grid;grid-template-columns:1.1fr 1.5fr 1.5fr .8fr .7fr .7fr 1fr auto;
    gap:8px;align-items:end;border-bottom:1px dashed var(--line);padding:10px 0
  }
  #presupuestoEvalRoot .team-row input, #presupuestoEvalRoot .team-row select{width:100%;padding:9px;border:1px solid #cfd8dc;border-radius:8px}
  #presupuestoEvalRoot .danger{color:var(--danger)}
  #presupuestoEvalRoot .hint{font-size:12px;color:var(--muted);margin-top:8px}
  #presupuestoEvalRoot .event-card{border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
  #presupuestoEvalRoot .event-card a{color:var(--brand);font-weight:700}
  #presupuestoEvalRoot .toast{position:fixed;right:22px;bottom:22px;background:#263238;color:#fff;padding:13px 16px;border-radius:10px;z-index:50}
  #presupuestoEvalRoot .hidden{display:none!important}
  #presupuestoEvalRoot .busy{
    position:fixed;inset:0;background:rgba(255,255,255,.82);z-index:100;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-weight:700
  }
  #presupuestoEvalRoot .spinner{width:38px;height:38px;border:4px solid #dce6e2;border-top-color:var(--brand);border-radius:50%;animation:pePresSpin 1s linear infinite}
  @keyframes pePresSpin{to{transform:rotate(360deg)}}
  #presupuestoEvalRoot pre.diag{white-space:pre-wrap;background:#111827;color:#e5e7eb;padding:15px;border-radius:10px;font-size:12px}
  @media(max-width:900px){
    #presupuestoEvalRoot .tabs{grid-template-columns:repeat(2,1fr)}
    #presupuestoEvalRoot .grid, #presupuestoEvalRoot .grid3, #presupuestoEvalRoot .summary-grid{grid-template-columns:1fr}
    #presupuestoEvalRoot .team-row{grid-template-columns:1fr 1fr}
    #presupuestoEvalRoot .topbar{align-items:flex-start;flex-direction:column}
  }

#presupuestoEvalRoot .login-page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:30px 18px;
  background:
    radial-gradient(circle at 15% 20%, rgba(53,104,84,.08), transparent 32%),
    radial-gradient(circle at 85% 80%, rgba(53,104,84,.06), transparent 35%),
    var(--bg);
}
#presupuestoEvalRoot .login-card{
  width:min(460px,100%);
  background:var(--card);
  border:1px solid var(--line);
  border-radius:22px;
  box-shadow:var(--shadow);
  padding:34px;
}
#presupuestoEvalRoot .login-brand{
  width:62px;height:62px;border-radius:16px;
  display:flex;align-items:center;justify-content:center;
  background:var(--brand);color:white;
  font-size:22px;font-weight:800;
  margin-bottom:18px;
}
#presupuestoEvalRoot .login-card h1{margin:5px 0 8px;font-size:28px}
#presupuestoEvalRoot .login-lead{color:var(--muted);font-size:14px;line-height:1.55;margin:0 0 24px}
#presupuestoEvalRoot .check-row{
  display:flex;align-items:center;gap:10px;
  margin:16px 0;color:#46545e;font-size:13px;
}
#presupuestoEvalRoot .check-row input{width:17px;height:17px}
#presupuestoEvalRoot .login-button{width:100%;font-size:15px}
#presupuestoEvalRoot .login-note{
  margin-top:18px;padding:12px 13px;border-radius:10px;
  background:#f7f9f9;color:var(--muted);font-size:12px;line-height:1.45;
}
#presupuestoEvalRoot .login-meta{
  text-align:center;margin-top:18px;color:var(--muted);font-size:11px;
}


/* ===== V1.1 flujo ===== */
#presupuestoEvalRoot .login-check-hint{margin:-8px 0 16px 27px}
#presupuestoEvalRoot .search-row{
  display:grid;grid-template-columns:minmax(0,680px) auto;
  gap:16px;align-items:end;
}
#presupuestoEvalRoot .search-actions{margin:0;justify-content:flex-start;padding-bottom:22px}
#presupuestoEvalRoot .evaluation-section{
  display:grid;grid-template-columns:1.1fr 1fr;gap:16px;margin-bottom:18px;
}
#presupuestoEvalRoot .model-box, #presupuestoEvalRoot .date-box, #presupuestoEvalRoot .team-composition-wrap, #presupuestoEvalRoot .team-assignment-wrap{
  border:1px solid var(--line);border-radius:14px;padding:17px;
  background:#fbfcfc;margin-top:16px;
}
#presupuestoEvalRoot .model-title, #presupuestoEvalRoot .team-composition-wrap h3, #presupuestoEvalRoot .team-assignment-wrap h3{
  margin:0 0 14px;font-size:15px;color:var(--brand);
}
#presupuestoEvalRoot .compact-grid{
  display:flex;gap:12px;align-items:end;flex-wrap:wrap;
}
#presupuestoEvalRoot .compact-number{width:125px}
#presupuestoEvalRoot .compact-number input, #presupuestoEvalRoot .compact-number select{text-align:center}
#presupuestoEvalRoot .time-card{
  margin-top:16px;border-radius:12px;padding:14px 16px;
  display:flex;justify-content:space-between;gap:20px;align-items:center;
  border:1px solid #c9ddd4;background:var(--brand-soft);
}
#presupuestoEvalRoot .time-card.pending{background:#f7f9f9;border-color:var(--line)}
#presupuestoEvalRoot .time-label{font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:700}
#presupuestoEvalRoot .time-value{font-size:30px;font-weight:800;color:var(--brand);margin-top:2px}
#presupuestoEvalRoot .time-detail{font-size:12px;color:var(--muted);max-width:560px;text-align:right}
#presupuestoEvalRoot .date-box{display:grid;grid-template-columns:1fr 1fr;gap:16px}
#presupuestoEvalRoot .composition-table{width:100%;border-collapse:collapse;background:white}
#presupuestoEvalRoot .composition-table th, #presupuestoEvalRoot .composition-table td{
  border-bottom:1px solid var(--line);padding:10px 12px;text-align:left
}
#presupuestoEvalRoot .composition-table th{font-size:11px;text-transform:uppercase;color:var(--muted)}
#presupuestoEvalRoot .composition-table .qty{width:74px;padding:8px;border:1px solid #cfd8dc;border-radius:8px}
#presupuestoEvalRoot .composition-table select{padding:8px;border:1px solid #cfd8dc;border-radius:8px}
#presupuestoEvalRoot .fixed-type{font-weight:700;color:#46545e}
#presupuestoEvalRoot .split-count{display:flex;gap:14px}
#presupuestoEvalRoot .split-count label{display:flex;align-items:center;gap:6px;font-size:12px}
#presupuestoEvalRoot .team-assignments{display:flex;flex-direction:column;gap:10px}
#presupuestoEvalRoot .assignment-row{
  display:grid;
  grid-template-columns:185px minmax(260px,1.4fr) minmax(210px,1fr) 90px 80px 80px minmax(170px,1fr);
  gap:8px;align-items:center;padding:10px;border:1px solid var(--line);
  border-radius:11px;background:white;
}
#presupuestoEvalRoot .assignment-role{font-size:13px;font-weight:700;color:#34424a}
#presupuestoEvalRoot .assignment-row select, #presupuestoEvalRoot .assignment-row input{
  width:100%;padding:8px;border:1px solid #cfd8dc;border-radius:8px;font-size:12px
}
#presupuestoEvalRoot .assignment-row input[readonly]{background:#f5f7f8;color:#5c6870}
#presupuestoEvalRoot .assignment-meta{font-size:10px;color:var(--muted);margin-top:3px;line-height:1.25}
#presupuestoEvalRoot .team-loading{padding:12px;border-radius:10px;background:#f7f9f9;color:var(--muted)}
@media(max-width:1000px){
  #presupuestoEvalRoot .search-row, #presupuestoEvalRoot .evaluation-section, #presupuestoEvalRoot .date-box{grid-template-columns:1fr}
  #presupuestoEvalRoot .compact-number{width:calc(33.333% - 8px)}
  #presupuestoEvalRoot .assignment-row{grid-template-columns:1fr 1fr}
  #presupuestoEvalRoot .time-card{align-items:flex-start;flex-direction:column}
  #presupuestoEvalRoot .time-detail{text-align:left}
}


/* ===== V1.2 experiencia visual / preview ===== */
#presupuestoEvalRoot .center-success{
  position:fixed;inset:0;z-index:2500;
  display:flex;align-items:center;justify-content:center;
  background:rgba(16,34,27,.28);
  backdrop-filter:blur(2px);
}
#presupuestoEvalRoot .center-success-card{
  width:min(460px,calc(100% - 34px));
  background:#fff;border:1px solid #cfe0d8;border-radius:20px;
  box-shadow:0 24px 70px rgba(20,45,36,.24);
  padding:30px;text-align:center;
  animation:pePresSuccessPop .18s ease-out;
}
#presupuestoEvalRoot .center-success-icon{
  width:64px;height:64px;margin:0 auto 14px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--brand);color:white;font-size:34px;font-weight:800;
}
#presupuestoEvalRoot .center-success-title{font-size:21px;font-weight:800;color:#25342e}
#presupuestoEvalRoot .center-success-detail{margin-top:8px;color:var(--muted);font-size:13px;line-height:1.45}
@keyframes pePresSuccessPop{
  from{opacity:0;transform:translateY(8px) scale(.97)}
  to{opacity:1;transform:none}
}

#presupuestoEvalRoot .days-policy{
  margin:0 0 12px;padding:10px 12px;border-radius:10px;
  background:var(--brand-soft);border:1px solid #cfe0d8;
  color:#365449;font-size:12px;line-height:1.45;
}
#presupuestoEvalRoot .assignment-header{
  display:grid;
  grid-template-columns:185px minmax(260px,1.4fr) minmax(210px,1fr) 90px 105px 105px minmax(170px,1fr);
  gap:8px;padding:0 10px 7px;color:var(--muted);
  font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;
}
#presupuestoEvalRoot .assignment-header span{
  font-size:9px;font-weight:600;text-transform:none;letter-spacing:0;
}
#presupuestoEvalRoot .assignment-row{
  grid-template-columns:185px minmax(260px,1.4fr) minmax(210px,1fr) 90px 105px 105px minmax(170px,1fr);
}
#presupuestoEvalRoot .assignment-row .day-locked{
  background:#eef5f2;color:#2c5948;font-weight:800;
  border-color:#cfe0d8;
}
#presupuestoEvalRoot .control-warning{
  display:flex;gap:13px;align-items:flex-start;
  padding:15px 16px;border-radius:13px;
  border:1px solid #e8c96f;background:#fff9e7;margin:16px 0;
}
#presupuestoEvalRoot .control-warning-icon{
  flex:0 0 28px;width:28px;height:28px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:#b7791f;color:white;font-weight:900;
}
#presupuestoEvalRoot .control-warning-title{font-weight:800;color:#684b14}
#presupuestoEvalRoot .control-warning-text{margin-top:2px;color:#765b24;font-size:13px}
#presupuestoEvalRoot .doc-preview{margin-top:15px}
#presupuestoEvalRoot .preview-hero{
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));
  gap:10px;margin-bottom:14px;
}
#presupuestoEvalRoot .preview-stat{
  padding:12px;border:1px solid var(--line);border-radius:11px;background:#fbfcfc;
}
#presupuestoEvalRoot .preview-stat .k{
  color:var(--muted);font-size:9px;font-weight:800;text-transform:uppercase;
}
#presupuestoEvalRoot .preview-stat .v{
  margin-top:4px;color:#263a32;font-size:13px;font-weight:800;overflow-wrap:anywhere;
}
#presupuestoEvalRoot .preview-doc-grid{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0;
}
#presupuestoEvalRoot .preview-doc-card{
  border:1px solid var(--line);border-radius:12px;padding:13px;background:#fff;
}
#presupuestoEvalRoot .preview-doc-card.no-aplica{background:#f7f8f8;opacity:.72}
#presupuestoEvalRoot .preview-doc-status{
  display:inline-flex;padding:3px 7px;border-radius:99px;
  font-size:9px;font-weight:800;text-transform:uppercase;background:#e8f4ee;color:#286047;
}
#presupuestoEvalRoot .preview-doc-card.no-aplica .preview-doc-status{background:#eceff0;color:#6b7478}
#presupuestoEvalRoot .preview-doc-name{font-weight:800;margin-top:8px;color:#2c3d36}
#presupuestoEvalRoot .preview-doc-detail{font-size:11px;color:var(--muted);line-height:1.45;margin-top:5px}
#presupuestoEvalRoot .preview-team-table{width:100%;border-collapse:collapse;margin-top:10px;background:white}
#presupuestoEvalRoot .preview-team-table th, #presupuestoEvalRoot .preview-team-table td{
  padding:8px 9px;border-bottom:1px solid var(--line);text-align:left;font-size:11px;
}
#presupuestoEvalRoot .preview-team-table th{
  font-size:9px;text-transform:uppercase;color:var(--muted);background:#f7f9f8;
}
#presupuestoEvalRoot .preview-warning-list{
  margin-top:12px;padding:10px 12px;border-radius:10px;
  background:#fff8e8;border:1px solid #ecd694;color:#795b1d;font-size:11px;
}
#presupuestoEvalRoot .preview-confirm{
  margin-top:16px;padding:12px 14px;border:1px solid var(--line);
  border-radius:11px;background:#fafbfb;
}
#presupuestoEvalRoot .document-actions{justify-content:flex-end}
#presupuestoEvalRoot button.secondary{
  border:1px solid #c9d2d0;background:#fff;color:#43524d;
  padding:10px 15px;border-radius:9px;font-weight:700;cursor:pointer;
}
#presupuestoEvalRoot button.primary:disabled{
  opacity:.45;cursor:not-allowed;filter:grayscale(.15);
}
@media(max-width:1100px){
  #presupuestoEvalRoot .assignment-header{display:none}
  #presupuestoEvalRoot .assignment-row{grid-template-columns:1fr 1fr}
  #presupuestoEvalRoot .preview-hero{grid-template-columns:1fr 1fr}
  #presupuestoEvalRoot .preview-doc-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:650px){
  #presupuestoEvalRoot .preview-hero, #presupuestoEvalRoot .preview-doc-grid{grid-template-columns:1fr}
}


/* ===== V1.3 días sugeridos editables ===== */
#presupuestoEvalRoot .days-adjust-hint{margin:8px 0 12px}
#presupuestoEvalRoot .assignment-row input.field-error{
  border-color:#b42318;
  box-shadow:0 0 0 2px rgba(180,35,24,.08);
  background:#fff7f6;
}


/* ===== V1.4 responsive + áreas + excepción de tipo ===== */
#presupuestoEvalRoot .evaluation-override-check{
  margin:10px 0 2px;
}
#presupuestoEvalRoot .evaluation-override-hint.active-warning{
  margin-top:6px;
  padding:8px 10px;
  border-radius:8px;
  background:#fff7e6;
  border:1px solid #ead08a;
  color:#73571c;
  font-weight:600;
}

#presupuestoEvalRoot .assignment-member-cell{
  min-width:0;
}
#presupuestoEvalRoot .assignment-area-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-top:7px;
}
#presupuestoEvalRoot .assignment-area-field label{
  display:block;
  margin:0 0 3px;
  font-size:9px;
  font-weight:700;
  color:var(--muted);
}
#presupuestoEvalRoot .assignment-area-field input, #presupuestoEvalRoot .assignment-area-field textarea{
  width:100%;
  box-sizing:border-box;
  min-height:34px;
  padding:7px 8px;
  border:1px solid #cfd8dc;
  border-radius:8px;
  font-size:10px;
  font-family:inherit;
  resize:vertical;
}
#presupuestoEvalRoot .assignment-area-field textarea[readonly], #presupuestoEvalRoot .assignment-area-field input[readonly]{
  background:#f5f7f8;
  color:#58656b;
}

#presupuestoEvalRoot .assignment-control{
  min-width:0;
}
#presupuestoEvalRoot .responsive-field-label{
  display:none;
  margin:0 0 4px;
  font-size:10px;
  font-weight:800;
  color:#52635c;
}

@media(max-width:1100px){
  #presupuestoEvalRoot .assignment-row{
    grid-template-columns:1fr 1fr;
    align-items:start;
  }
  #presupuestoEvalRoot .assignment-role{
    grid-column:1 / -1;
    padding:4px 0 2px;
    border-bottom:1px solid var(--line);
  }
  #presupuestoEvalRoot .assignment-member-cell{
    grid-column:1 / -1;
  }
  #presupuestoEvalRoot .responsive-field-label{
    display:block;
  }
  #presupuestoEvalRoot .assignment-area-grid{
    grid-template-columns:1fr 1fr;
  }
}

@media(max-width:700px){
  #presupuestoEvalRoot .assignment-row{
    grid-template-columns:1fr;
  }
  #presupuestoEvalRoot .assignment-member-cell, #presupuestoEvalRoot .assignment-role{
    grid-column:1;
  }
  #presupuestoEvalRoot .assignment-area-grid{
    grid-template-columns:1fr;
  }
}


/* ===== HOTFIX V1.4.1 Document Preview ===== */
#presupuestoEvalRoot .preview-compatibility-error{
  margin-top:16px;
  padding:14px 16px;
  border:1px solid #d92d20;
  border-radius:10px;
  background:#fff6f5;
  color:#7a271a;
  line-height:1.45;
}


/* ===== Sitios + duplicados ===== */
#presupuestoEvalRoot .sites-box{
  margin-top:16px;padding:17px;border:1px solid var(--line);
  border-radius:14px;background:#fbfcfc;
}
#presupuestoEvalRoot .sites-box-header{
  display:flex;justify-content:space-between;gap:18px;align-items:flex-start;
  margin-bottom:12px;
}
#presupuestoEvalRoot .sites-box h3{margin:0 0 5px;font-size:15px;color:var(--brand)}
#presupuestoEvalRoot .sites-count{
  white-space:nowrap;padding:6px 10px;border-radius:999px;
  background:var(--brand-soft);color:var(--brand);font-size:11px;font-weight:800;
}
#presupuestoEvalRoot .sites-list{display:flex;flex-direction:column;gap:10px}
#presupuestoEvalRoot .site-card{
  border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;
}
#presupuestoEvalRoot .site-card.selected{border-color:#9fc7b6;background:#fbfefd}
#presupuestoEvalRoot .site-head{display:flex;gap:10px;align-items:flex-start}
