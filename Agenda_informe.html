<style>
  /* =========================================================
     FORMULARIO INFORME AGENDA - PARCIAL SPA
     Compatible con App.html / window.OGA.navegar()
     ========================================================= */
  #fia-root {
    width: 100%;
    min-height: calc(100vh - 120px);
    background: #f4f6f8;
    font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    color: #1f2937;
    padding: 18px;
  }

  #fia-root * {
    box-sizing: border-box;
  }

  .fia-shell {
    width: min(1500px, 100%);
    margin: 0 auto;
    background: #ffffff;
    border: 1px solid #e5e7eb;
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 18px 45px rgba(15, 23, 42, 0.12);
  }

  .fia-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: 18px 20px;
    background: linear-gradient(135deg, #0f766e 0%, #2563eb 100%);
    color: #ffffff;
  }

  .fia-title-wrap {
    min-width: 0;
  }

  .fia-title {
    margin: 0;
    font-size: clamp(1.1rem, 2vw, 1.55rem);
    font-weight: 800;
    letter-spacing: -0.02em;
  }

  .fia-subtitle {
    margin: 4px 0 0;
    color: rgba(255, 255, 255, 0.82);
    font-size: 0.9rem;
  }

  .fia-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .fia-btn {
    border: 0;
    min-height: 40px;
    padding: 0 14px;
    border-radius: 12px;
    font-weight: 800;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease;
    font-size: 0.9rem;
    white-space: nowrap;
  }

  .fia-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 10px 20px rgba(15, 23, 42, 0.18);
  }

  .fia-btn-secondary {
    background: rgba(255, 255, 255, 0.16);
    color: #ffffff;
    border: 1px solid rgba(255, 255, 255, 0.25);
  }

  .fia-btn-primary {
    background: #ffffff;
    color: #1d4ed8;
  }

  .fia-statusbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 18px;
    background: #f8fafc;
    border-bottom: 1px solid #e5e7eb;
    flex-wrap: wrap;
  }

  .fia-status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: #475569;
    font-size: 0.9rem;
    font-weight: 700;
  }

  .fia-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #22c55e;
    box-shadow: 0 0 0 5px rgba(34, 197, 94, 0.15);
  }

  .fia-dot.warning {
    background: #f59e0b;
    box-shadow: 0 0 0 5px rgba(245, 158, 11, 0.15);
  }

  .fia-dot.error {
    background: #ef4444;
    box-shadow: 0 0 0 5px rgba(239, 68, 68, 0.15);
  }

  .fia-loader-wrap {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: #2563eb;
    font-weight: 800;
    font-size: 0.9rem;
  }

  .fia-loader {
    display: inline-block;
    border: 4px solid #e5e7eb;
    border-top: 4px solid #2563eb;
    border-radius: 50%;
    width: 28px;
    height: 28px;
    animation: fia-spin 1s linear infinite;
  }

  @keyframes fia-spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  .fia-frame-wrap {
    position: relative;
    width: 100%;
    background: #ffffff;
    min-height: 720px;
  }

  #fia-iframe {
    display: block;
    width: 100%;
    min-height: 720px;
    height: calc(100vh - 230px);
    border: none;
    background: #ffffff;
  }

  #fia-toast {
    visibility: hidden;
    min-width: 280px;
    max-width: min(420px, calc(100vw - 32px));
    background: rgba(15, 23, 42, 0.95);
    color: #ffffff;
    text-align: left;
    border-radius: 14px;
    padding: 13px 15px;
    position: fixed;
    z-index: 9999;
    bottom: 22px;
    right: 22px;
    font-size: 15px;
    box-shadow: 0 18px 35px rgba(15, 23, 42, 0.25);
    border: 1px solid rgba(255, 255, 255, 0.15);
  }

  #fia-toast.show {
    visibility: visible;
    animation: fia-fadein 0.35s, fia-fadeout 0.45s 4.8s;
  }

  #fia-toast.success {
    border-color: rgba(34, 197, 94, 0.55);
  }

  #fia-toast.warning {
    border-color: rgba(245, 158, 11, 0.55);
  }

  #fia-toast.error {
    border-color: rgba(239, 68, 68, 0.55);
  }

  @keyframes fia-fadein {
    from { bottom: 0; opacity: 0; transform: translateY(8px); }
    to { bottom: 22px; opacity: 1; transform: translateY(0); }
  }

  @keyframes fia-fadeout {
    from { bottom: 22px; opacity: 1; transform: translateY(0); }
    to { bottom: 0; opacity: 0; transform: translateY(8px); }
  }

  @media (max-width: 720px) {
    #fia-root {
      padding: 10px;
    }

    .fia-header {
      align-items: flex-start;
      flex-direction: column;
    }

    .fia-actions {
      width: 100%;
      justify-content: stretch;
    }

    .fia-btn {
      flex: 1;
    }

    #fia-iframe {
      height: calc(100vh - 270px);
      min-height: 640px;
    }

    #fia-toast {
      right: 12px;
      left: 12px;
      bottom: 14px;
      min-width: auto;
    }
  }
</style>

<div id="fia-root">
  <section class="fia-shell" aria-label="Formulario de informe de agenda">
    <header class="fia-header">
      <div class="fia-title-wrap">
        <h1 class="fia-title">Informe de Agenda</h1>
        <p class="fia-subtitle">Formulario embebido para registrar la información correspondiente.</p>
      </div>

      <div class="fia-actions">
        <button type="button" class="fia-btn fia-btn-secondary" onclick="fiaVolverAlMenu()">
          <span>←</span><span>Volver al menú</span>
        </button>
        <button type="button" class="fia-btn fia-btn-primary" onclick="fiaReiniciarVerificacion()">
          <span>🔄</span><span>Verificar envío</span>
        </button>
      </div>
    </header>

    <div class="fia-statusbar">
      <div class="fia-status" id="fia-status">
        <span class="fia-dot warning" id="fia-status-dot"></span>
        <span id="fia-status-text">Preparando verificación del formulario...</span>
      </div>

      <div class="fia-loader-wrap" id="fia-loader-wrap">
        <span class="fia-loader" id="fia-loader"></span>
        <span id="fia-loader-text">Esperando envío</span>
      </div>
    </div>

    <div class="fia-frame-wrap">
      <iframe
        id="fia-iframe"
        title="Formulario informe de agenda"
        src="https://docs.google.com/forms/d/e/1FAIpQLSdRJSC-1V8tnWACczWJw8-4LYMU1FhoTuokFI9_AZShWbXJzQ/viewform?embedded=true"
        allowfullscreen>
      </iframe>
    </div>
  </section>

  <div id="fia-toast" role="status" aria-live="polite"></div>
</div>

<script>
  /* =========================================================
     FORMULARIO INFORME AGENDA - JS SPA
     Sin window.onload, sin google.script.host.close()
     ========================================================= */
  var FIA = window.FIA || {};

  FIA.marcaAnterior = Date.now();
  FIA.cerradoManualmente = true;
  FIA.intentos = 0;
  FIA.intentosMaximos = 10;
  FIA.intervalo = 3000;
  FIA.retardoInicial = 8000;
  FIA.timeoutInicial = null;
  FIA.timeoutVerificacion = null;
  FIA.finalizado = false;
  window.FIA = FIA;

  function fiaMostrarToast(msg, tipo) {
    var toast = document.getElementById('fia-toast');
    if (!toast) return;

    toast.textContent = msg;
    toast.className = (tipo || 'info') + ' show';

    clearTimeout(toast._fiaTimer);
    toast._fiaTimer = setTimeout(function () {
      toast.className = toast.className.replace('show', '').trim();
    }, 5500);
  }

  function fiaSetEstado(texto, tipo, cargando) {
    var statusText = document.getElementById('fia-status-text');
    var dot = document.getElementById('fia-status-dot');
    var loaderWrap = document.getElementById('fia-loader-wrap');
    var loaderText = document.getElementById('fia-loader-text');

    if (statusText) statusText.textContent = texto || '';

    if (dot) {
      dot.classList.remove('warning', 'error');
      if (tipo === 'error') dot.classList.add('error');
      else if (tipo === 'warning') dot.classList.add('warning');
    }

    if (loaderWrap) loaderWrap.style.display = cargando === false ? 'none' : 'inline-flex';
    if (loaderText) loaderText.textContent = cargando === false ? '' : 'Verificando';
  }

  function fiaLimpiarTimers() {
    if (FIA.timeoutInicial) {
      clearTimeout(FIA.timeoutInicial);
      FIA.timeoutInicial = null;
    }
    if (FIA.timeoutVerificacion) {
      clearTimeout(FIA.timeoutVerificacion);
      FIA.timeoutVerificacion = null;
    }
  }

  function fiaVolverAlMenu() {
    FIA.cerradoManualmente = false;
    fiaLimpiarTimers();

    if (window.OGA && typeof window.OGA.irAlMenu === 'function') {
      window.OGA.irAlMenu();
      return;
    }

    if (window.parent && window.parent.OGA && typeof window.parent.OGA.irAlMenu === 'function') {
      window.parent.OGA.irAlMenu();
      return;
    }

    if (window.parent && typeof window.parent.mostrarPanelDesdeIframe === 'function') {
      window.parent.mostrarPanelDesdeIframe();
      return;
    }

    console.warn('No se encontró router SPA para volver al menú.');
  }

  function fiaFinalizarPorEnvio() {
    FIA.finalizado = true;
    FIA.cerradoManualmente = false;
    fiaLimpiarTimers();

    fiaSetEstado('Datos enviados correctamente. Regresando al menú...', 'success', false);
    fiaMostrarToast('✅ Datos enviados correctamente', 'success');

    setTimeout(function () {
      fiaVolverAlMenu();
    }, 1800);
  }

  function fiaVerificarEnvioFormulario() {
    if (FIA.finalizado) return;

    console.log('🔄 Intento ' + (FIA.intentos + 1));
    fiaSetEstado('Verificando envío del formulario... intento ' + (FIA.intentos + 1) + ' de ' + FIA.intentosMaximos, 'warning', true);

    if (!(window.google && google.script && google.script.run)) {
      fiaSetEstado('No hay conexión con google.script.run. Esta vista debe ejecutarse desde Apps Script.', 'error', false);
      fiaMostrarToast('❌ No hay conexión con Apps Script', 'error');
      return;
    }

    google.script.run
      .withSuccessHandler(function (res) {
        console.log('📥 Resultado:', res);

        if (res && res.hayNueva) {
          fiaFinalizarPorEnvio();
          return;
        }

        FIA.intentos++;

        if (FIA.intentos < FIA.intentosMaximos) {
          FIA.timeoutVerificacion = setTimeout(fiaVerificarEnvioFormulario, FIA.intervalo);
        } else {
          fiaSetEstado('No se detectó envío después de los intentos permitidos.', 'error', false);
          fiaMostrarToast('❌ Se alcanzó el número máximo de intentos', 'error');
          console.warn('⛔ Máximo de intentos alcanzado');
        }
      })
      .withFailureHandler(function (err) {
        console.error('❌ Error verificando formulario:', err);
        FIA.intentos++;

        if (FIA.intentos < FIA.intentosMaximos) {
          fiaSetEstado('Error temporal verificando. Reintentando...', 'warning', true);
          FIA.timeoutVerificacion = setTimeout(fiaVerificarEnvioFormulario, FIA.intervalo);
        } else {
          fiaSetEstado('Error al verificar el envío del formulario.', 'error', false);
          fiaMostrarToast('❌ Error al verificar el formulario', 'error');
        }
      })
      .hayNuevaEntradaInformeAgenda(FIA.marcaAnterior);
  }

  function fiaReiniciarVerificacion() {
    FIA.marcaAnterior = Date.now();
    FIA.intentos = 0;
    FIA.finalizado = false;
    fiaLimpiarTimers();

    fiaSetEstado('Esperando el envío del formulario...', 'warning', true);
    fiaMostrarToast('📝 Esperando el envío del formulario...', 'warning');

    FIA.timeoutInicial = setTimeout(function () {
      console.log('🕒 Iniciando verificación tras retardo...');
      fiaVerificarEnvioFormulario();
    }, FIA.retardoInicial);
  }

  function fiaInit() {
    fiaLimpiarTimers();
    fiaSetEstado('Esperando el envío del formulario...', 'warning', true);
    fiaMostrarToast('📝 Esperando el envío del formulario...', 'warning');

    FIA.timeoutInicial = setTimeout(function () {
      console.log('🕒 Iniciando verificación tras retardo...');
      fiaVerificarEnvioFormulario();
    }, FIA.retardoInicial);
  }

  // Limpieza al salir del módulo SPA.
  if (window.OGA && typeof window.OGA.onUnmount === 'function') {
    window.OGA.onUnmount(function () {
      FIA.cerradoManualmente = false;
      fiaLimpiarTimers();
    });
  }

  // Compatibilidad si el usuario cierra/recarga la vista.
  window.addEventListener('beforeunload', function () {
    if (FIA.cerradoManualmente) {
      fiaLimpiarTimers();
    }
  });

  // Inicialización inmediata porque en SPA DOMContentLoaded/window.onload no se disparan al inyectar el parcial.
  fiaInit();
</script>
